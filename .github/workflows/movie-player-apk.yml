name: Build NeonFilm APK

on:
  push:
    branches: [movie-player]
    paths:
      - 'MoviePlayer.zip'
      - '.github/workflows/movie-player-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unpack movie player project
        run: unzip -q -o MoviePlayer.zip -d .
      - name: Apply new NeonFilm icon
        run: cp NeonFilmAssets/ic_launcher.xml MoviePlayer/app/src/main/res/drawable/ic_launcher.xml
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/commandlinetools.zip
          unzip -q /tmp/commandlinetools.zip -d /tmp/android-cmd
          mv /tmp/android-cmd/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile APK
        working-directory: MoviePlayer
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp MoviePlayer/app/build/outputs/apk/debug/app-debug.apk NeonFilm-1.0.apk
      - name: Publish Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonFilm-APK
          path: NeonFilm-1.0.apk
          retention-days: 30
          if-no-files-found: error
