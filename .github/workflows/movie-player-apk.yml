name: Build NeonFilm APK

on:
  push:
    branches: [movie-player]
    paths:
      - 'MoviePlayer.zip'
      - '.github/workflows/movie-player-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unpack movie player project
        run: unzip -q -o MoviePlayer.zip -d .
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile APK
        working-directory: MoviePlayer
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp MoviePlayer/app/build/outputs/apk/debug/app-debug.apk NeonFilm-1.0.apk
      - name: Publish Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonFilm-APK
          path: NeonFilm-1.0.apk
          retention-days: 30
          if-no-files-found: error
