name: NeonRush Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game.zip'
      - 'NeonRush_Godot_Android_GitHub.zip'
      - '.github/workflows/neonrush-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Godot Android export tools for Actions user
        shell: bash
        run: |
          set -euo pipefail
          echo "HOME=$HOME"
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/4.7.2.stable "$HOME/.local/share/godot/export_templates/"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -d /usr/lib/jvm/java-17-openjdk-amd64
          test -d /usr/lib/android-sdk
          echo "Godot export templates, editor settings, Java and Android SDK found."
          grep -E 'java_sdk_path|android_sdk_path' "$HOME/.config/godot/editor_settings-4.7.tres" || true

      - name: Unpack game project
        shell: bash
        run: |
          set -euo pipefail
          if [ -s game.zip ]; then
            ARCHIVE=game.zip
          elif [ -s NeonRush_Godot_Android_GitHub.zip ]; then
            ARCHIVE=NeonRush_Godot_Android_GitHub.zip
          else
            echo "Upload game.zip to repository root"
            exit 1
          fi
          mkdir -p game
          unzip -q "$ARCHIVE" -d game
          test -f game/project.godot
          test -f game/export_presets.cfg
          # Godot requires ETC2/ASTC import for Android, even with GL Compatibility.
          if ! grep -q '^textures/vram_compression/import_etc2_astc=true' game/project.godot; then
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' game/project.godot
          fi
          grep -q '^textures/vram_compression/import_etc2_astc=true' game/project.godot

      - name: Install Python 3 for game upgrade
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3
          python3 --version

      - name: Upgrade art and gameplay to Turbo edition
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/upgrade.py
          grep -q 'orientation=4' game/project.godot
          test -s game/assets/deluxe/run_7.svg

      - name: Apply responsive controls and world variety
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/improve_v4.py
          test -s game/scripts/game.gd

      - name: Import graphics and scripts
        working-directory: game
        run: godot --headless --editor --quit

      - name: Export Android debug APK
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --export-debug "Android" build/NeonRush-debug.apk
          test -s build/NeonRush-debug.apk
          echo "APK built successfully!"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonRush-Android-APK
          path: game/build/NeonRush-debug.apk
          if-no-files-found: error

      - name: Publish APK as a direct-download GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0
          name: NeonRush Turbo — тестовая версия 0.4.0
          prerelease: true
          draft: false
          make_latest: false
          files: game/build/NeonRush-debug.apk
          fail_on_unmatched_files: true
          body: |
            Тестовая сборка 2D-платформера NeonRush для Android.
            Для установки скачайте NeonRush-debug.apk из раздела Assets на этой странице.
            Это отладочный APK; работа игры на реальных Android-устройствах ещё не проверена.
