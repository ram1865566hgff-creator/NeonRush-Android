name: Remove obsolete NeonFilm releases
on:
  push:
    branches: [movie-player]
    paths: ['.github/workflows/cleanup-neonfilm-releases.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify NeonFilm 1.4 exists and delete only prior NeonFilm releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view neonfilm-v1.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null
          for tag in neonfilm-v1.0.0 neonfilm-v1.1.0 neonfilm-v1.2.0 neonfilm-v1.3.0; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              echo "Deleted obsolete NeonFilm release $tag"
            fi
          done
          gh release view neonfilm-v1.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null
